---
# SalesGenie Logging Configuration
# Structured JSON logging for observability

logging:
  level: INFO
  format: json
  
  # Console output
  console:
    enabled: true
    stream: stdout
    
  # File output
  file:
    enabled: true
    directory: /var/log/salesgenie
    filename: app.log
    max_bytes: 10485760  # 10MB
    backup_count: 5
    
  # Error log
  error_file:
    enabled: true
    filename: error.log
    max_bytes: 10485760
    backup_count: 5
    
  # Syslog
  syslog:
    enabled: false
    address: /dev/log
    facility: local0
    
  # Fields to include in all logs
  fields:
    service: salesgenie
    environment: production
    version: 1.0.0
    
  # Sensitive fields to redact
  redact:
    - password
    - token
    - api_key
    - secret
    - authorization
    - cookie
    
  # Sampling for high-volume logs
  sampling:
    enabled: true
    rate: 0.1  # Log 10% of requests
    
  # Log levels by module
  module_levels:
    enterprise_ai_platform.api_gateway: INFO
    enterprise_ai_platform.lead_intelligence_service: INFO
    enterprise_ai_platform.whatsapp_service: INFO
    sqlalchemy: WARNING
    uvicorn: INFO
    httpx: WARNING

# Request logging middleware
request_logging:
  enabled: true
  log_request_body: false
  log_response_body: false
  mask_headers:
    - Authorization
    - Cookie
    - X-API-Key
    
  # Log format for requests
  format: |
    {"type": "request", "method": "%(method)s", "path": "%(path)s", 
     "query_string": "%(query_string)s", "headers": %(headers)s,
     "body_size": %(body_size)s, "remote_addr": "%(remote_addr)s"}
     
  # Log format for responses
  response_format: |
    {"type": "response", "status": %(status)s, "duration_ms": %(duration_ms)s,
     "body_size": %(body_size)s, "response_headers": %(response_headers)s}

# Error logging
error_logging:
  enabled: true
  include_stack_trace: true
  include_local_vars: false  # Security: don't log local variables
  include_request_context: true
  
  # Error categories
  categories:
    - validation_error
    - authentication_error
    - authorization_error
    - database_error
    - external_api_error
    - rate_limit_error
    - business_logic_error

# Audit logging
audit_logging:
  enabled: true
  directory: /var/log/salesgenie/audit
  filename: audit.log
  
  # Events to audit
  events:
    - user_login
    - user_logout
    - user_register
    - password_change
    - permission_change
    - data_access
    - data_modification
    - api_key_create
    - api_key_delete
    - configuration_change

# Metrics logging
metrics_logging:
  enabled: true
  interval: 60  # Log metrics every 60 seconds
  
  metrics:
    - http_requests_total
    - http_request_duration_seconds
    - http_response_size_bytes
    - database_query_duration_seconds
    - ai_tokens_used_total
    - ai_request_duration_seconds
    - cache_hits_total
    - cache_misses_total

# Trace logging
trace_logging:
  enabled: true
  sample_rate: 0.01  # 1% of traces
  
  # Trace context fields
  context_fields:
    - trace_id
    - span_id
    - parent_span_id
    - service_name
    - operation_name
    - start_time
    - duration_ms
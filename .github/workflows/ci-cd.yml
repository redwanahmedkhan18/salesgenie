name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install ruff>=0.12.9 mypy>=1.17.1

      - name: Run ruff lint
        run: ruff check enterprise-ai-platform/ --select F,E,W,UP --ignore E501,E712,E741

      - name: Run mypy type check
        run: |
          pip install -r enterprise-ai-platform/requirements.txt
          mypy enterprise-ai-platform/common/ --ignore-missing-imports --no-strict-optional || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd redis-cli\ ping
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r enterprise-ai-platform/requirements.txt

      - name: Run unit tests
        run: |
          pytest tests/ -v --cov=src --cov-report=xml

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --cov=src --cov-report=xml

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high --omit=dev

      - name: Install Python security tools
        run: |
          pip install bandit safety pip-audit

      - name: Run Bandit SAST scan
        run: |
          bandit -r enterprise-ai-platform/ -x "*/tests/*,*/migrations/*,*/__pycache__/*" -f sarif -o bandit-results.sarif || true

      - name: Upload Bandit SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif

      - name: Run pip-audit dependency scan
        run: |
          pip-audit --requirement enterprise-ai-platform/requirements.txt --output-format json --output-file pip-audit-results.json || true
          echo "pip-audit complete"

      - name: Run safety dependency scan
        run: |
          safety check --json --file enterprise-ai-platform/requirements.txt --output safety-results.json || true
          echo "safety check complete"

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run frontend security regression tests
        run: |
          pip install pytest
          python -m pytest tests/security/test_security_regression.py -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.ref == 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-scan:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  deploy-staging:
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Staging
        uses: azure/k8s-deploy@v4
        with:
          namespace: salesgenie-staging
          manifests: |
            deployment/kubernetes/manifests/base.yaml
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          set-prod: false
          version: ${{ github.sha }}

      - name: Run health checks
        run: |
          kubectl wait --for=condition=available deployment/ai-gateway --timeout=120s -n salesgenie-staging
          kubectl wait --for=condition=ready pod -l app=ai-gateway --timeout=120s -n salesgenie-staging

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Deploy to Production
        uses: azure/k8s-deploy@v4
        with:
          namespace: salesgenie
          manifests: |
            deployment/kubernetes/manifests/base.yaml
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          set-prod: true
          version: ${{ github.sha }}

      - name: Run health checks
        run: |
          kubectl wait --for=condition=available deployment/ai-gateway --timeout=300s -n salesgenie
          kubectl wait --for=condition=ready pod -l app=ai-gateway --timeout=300s -n salesgenie

  performance:
    runs-on: ubuntu-latest
    needs: deploy-production
    steps:
      - name: Run load tests
        run: |
          echo "Running k6 load tests..."
          # k6 run load-tests/main.js

  notify:
    runs-on: ubuntu-latest
    needs: [deploy-production, performance]
    if: always()
    steps:
      - name: Send notification
        uses: belastings/github-action-discord@v2
        with:
          notification: ${{ needs.deploy-production.result }}
          webhook: ${{ secrets.DISCORD_WEBHOOK }}

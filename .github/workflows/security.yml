name: Security Scan

on:
  push:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install poetry
          poetry install
      
      - name: Run Bandit
        run: poetry run bandit -r enterprise-ai-platform/ -x enterprise_ai_platform/tests -f json -o bandit-results.json
      
      - name: Run Safety
        run: |
          poetry export -f requirements.txt --without-hashes | poetry run safety check --stdin --json > safety-results.json
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-results
          path: |
            bandit-results.json
            safety-results.json
      
      - name: Fail if vulnerabilities found
        run: |
          if [ -s bandit-results.json ] && [ $(jq '.metrics .severity.total' bandit-results.json) -gt 0 ]; then
            echo "Security vulnerabilities found"
            exit 1
          fi
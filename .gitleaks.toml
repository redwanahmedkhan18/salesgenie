# Gitleaks configuration for SalesGenie
# Detects secrets, API keys, and credentials in source code
# https://github.com/gitleaks/gitleaks

title = "SalesGenie Gitleaks Configuration"

[allowlist]
description = "Allowlist for intentionally committed non-secret values"
paths = [
    '''node_modules/''',
    '''dist/''',
    '''build/''',
    '''.git/''',
    '''__pycache__/''',
    '''*.pyc''',
    '''docs/examples/''',
]

[[rules]]
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
severity = "CRITICAL"
keywords = ["AKIA"]

[[rules]]
description = "AWS Secret Key"
regex = '''-----BEGIN RSA PRIVATE KEY-----'''
severity = "CRITICAL"
keywords = ["PRIVATE KEY"]

[[rules]]
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey)(['\"]?\s*[:=]\s*['\"]?)([a-z0-9\-_]{32,})'''
severity = "HIGH"
keywords = ["api_key", "apikey"]

[[rules]]
description = "Slack Webhook"
regex = '''https://hooks\.slack\.com/services/[a-zA-Z0-9-/]+'''
severity = "HIGH"
keywords = ["hooks.slack.com"]

[[rules]]
description = "Stripe API Key"
regex = '''sk_(live|test)_[a-zA-Z0-9]+'''
severity = "CRITICAL"
keywords = ["sk_live", "sk_test"]

[[rules]]
description = "GitHub Token"
regex = '''gh[pousr]_[A-Za-z0-9_-]{36}'''
severity = "HIGH"
keywords = ["ghp_", "gho_", "ghu_"]

[[rules]]
description = "Google API Key"
regex = '''AIza[0-9A-Za-z\\-_]{35}'''
severity = "HIGH"
keywords = ["AIza"]

[[rules]]
description = "WhatsApp API Token"
regex = '''(?i)(whatsapp|wa)[_-]?(api[_-]?token|token|key)(['\"]?\s*[:=]\s*['\"]?)([\w\-]{20,})'''
severity = "HIGH"
keywords = ["whatsapp", "wa_token"]

[[rules]]
description = "Database Password"
regex = '''(?i)(db[_-]?password|database[_-]?password|postgres[_-]?password|mysql[_-]?password)(['\"]?\s*[:=]\s*['\"])([^\s'\"\$]+)'''
severity = "CRITICAL"
keywords = ["password", "passwd", "pwd"]

[[rules]]
description = "Generic Password Assignment"
regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['\"]([^\s'\"]{6,})['\"]'''
severity = "HIGH"
keywords = ["password=", "password:"]

[build-system]
requires = ["hatchling>=1.0.0"]
build-backend = "hatchling.build"

[project]
name = "salesgenie-enterprise-ai-platform"
version = "1.0.0"
description = "SalesGenie Enterprise AI Platform Microservices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SalesGenie Team", email = "team@salesgenie.ai"}
]
keywords = ["ai", "sales", "crm", "microservices"]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.23.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "redis[hiredis]>=5.0.0",
    "pydantic>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "email-validator>=2.0.0",
    "pyotp>=2.8.0",
    "httpx>=0.25.0",
    "aiohttp>=3.9.0",
    "python-multipart>=0.0.7",
    "python-dotenv>=1.0.0",
    "python-keycloak>=3.0.0",
    "celery>=5.3.0",
    "flower>=2.0.0",
    "minio>=7.2.0",
    "pika>=1.3.0",
    "elasticsearch>=8.11.0",
    "pinecone-client>=4.0.0",
    "groq>=0.9.0",
    "google-generativeai>=0.8.6",
    "mistralai>=1.0.0",
    "tavily-python>=0.3.0",
    "whatsapp-cloud-api>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "httpx>=0.25.0",
]

[tool.hatch.build]
packages = ["enterprise_ai_platform"]

[tool.hatch.build.targets.wheel]
packages = ["enterprise_ai_platform"]

[tool.pytest.ini_options]
testpaths = ["enterprise-ai-platform/*/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: salesgenie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
        - name: customer-service
          image: salesgenie/customer-service:latest
          ports:
            - containerPort: 8015
          envFrom:
            - configMapRef:
                name: salesgenie-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8015
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8015
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: salesgenie
spec:
  selector:
    app: customer-service
  ports:
    - port: 8015
      targetPort: 8015
---

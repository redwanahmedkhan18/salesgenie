apiVersion: apps/v1
kind: Deployment
metadata:
  name: knowledge-service
  namespace: salesgenie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: knowledge-service
  template:
    metadata:
      labels:
        app: knowledge-service
    spec:
      containers:
        - name: knowledge-service
          image: salesgenie/knowledge-service:latest
          ports:
            - containerPort: 8006
          envFrom:
            - configMapRef:
                name: salesgenie-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8006
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8006
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: knowledge-service
  namespace: salesgenie
spec:
  selector:
    app: knowledge-service
  ports:
    - port: 8006
      targetPort: 8006
---

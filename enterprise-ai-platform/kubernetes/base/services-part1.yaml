apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: salesgenie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: salesgenie/auth-service:latest
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: salesgenie-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: salesgenie-secrets
                  key: POSTGRES_PASSWORD
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: salesgenie
spec:
  selector:
    app: auth-service
  ports:
    - port: 8001
      targetPort: 8001
---

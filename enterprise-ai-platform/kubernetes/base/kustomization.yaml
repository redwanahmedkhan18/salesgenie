apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: salesgenie

resources:
  - infrastructure.yaml
  - services-part1.yaml
  - services-part2.yaml
  - services-part3.yaml
  - services-part4.yaml

commonLabels:
  app.kubernetes.io/part-of: salesgenie-platform

configMapGenerator:
  - name: salesgenie-config
    literals:
      - DATABASE_URL=postgresql+asyncpg://salesgenie_admin:change_this_in_production@postgres:5432/salesgenie_db
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=salesgenie_minio
      - LOG_LEVEL=INFO

secretGenerator:
  - name: salesgenie-secrets
    literals:
      - POSTGRES_PASSWORD=change_this_in_production
      - MINIO_SECRET_KEY=change_this_in_production
      - JWT_SECRET_KEY=your_jwt_secret_key_here
apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: salesgenie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: file-service
  template:
    metadata:
      labels:
        app: file-service
    spec:
      containers:
        - name: file-service
          image: salesgenie/file-service:latest
          ports:
            - containerPort: 8014
          envFrom:
            - configMapRef:
                name: salesgenie-config
          env:
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: salesgenie-secrets
                  key: MINIO_SECRET_KEY
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8014
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8014
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: file-service
  namespace: salesgenie
spec:
  selector:
    app: file-service
  ports:
    - port: 8014
      targetPort: 8014
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-service
  namespace: salesgenie
spec:
  replicas: 2
  selector:
    matchLabels:
      app: workflow-service
  template:
    metadata:
      labels:
        app: workflow-service
    spec:
      containers:
        - name: workflow-service
          image: salesgenie/workflow-service:latest
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: salesgenie-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8010
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8010
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-service
  namespace: salesgenie
spec:
  selector:
    app: workflow-service
  ports:
    - port: 8010
      targetPort: 8010
---

groups:
- name: salesgenie.recording
  rules:
  # Record average response time
  - record: api:http_response_time:avg
    expr: avg(rate(http_request_duration_seconds_sum[5m])) by (service) / avg(rate(http_request_duration_seconds_count[5m])) by (service)

  # Record error rate
  - record: api:error_rate:5m
    expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m])

  # Record active connections
  - record: database:active_connections
    expr: pg_stat_database_numbackends

  # Record AI usage
  - record: ai:tokens_per_minute
    expr: rate(ai_tokens_used_total[1m])

  # Record queue length
  - record: redis:queue_length
    expr: redis_list_length{key=~"queue.*"}

  # Record cache hit ratio
  - record: redis:cache_hit_ratio
    expr: rate(redis_cache_hits_total[5m]) / (rate(redis_cache_hits_total[5m]) + rate(redis_cache_misses_total[5m]))
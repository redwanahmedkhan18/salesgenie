apiVersion: v1
kind: Namespace
metadata:
  name: salesgenie
  labels:
    environment: production
    app.kubernetes.io/name: salesgenie
---
apiVersion: v1
kind: Secret
metadata:
  name: salesgenie-secrets
  namespace: salesgenie
type: Opaque
data:
  DATABASE_URL: <base64-encoded-db-url>
  REDIS_URL: <base64-encoded-redis-url>
  JWT_SECRET: <base64-encoded-jwt-secret>
  STRIPE_SECRET_KEY: <base64-encoded-stripe-key>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: salesgenie-config
  namespace: salesgenie
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_VERSION: "v1"
  RATE_LIMIT_GLOBAL: "100000"
  RATE_LIMIT_AUTH: "10"
  CORS_ORIGINS: "https://salesgenie.ai,https://app.salesgenie.ai"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: salesgenie
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
    spec:
      containers:
      - name: ai-gateway
        image: ghcr.io/salesgenie/ai-gateway:latest
        ports:
        - containerPort: 8000
        envFrom:
        - configMapRef:
            name: salesgenie-config
        - secretRef:
            name: salesgenie-secrets
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
      autoscaling:
        enabled: true
        minReplicas: 3
        maxReplicas: 10
        targetCPUUtilizationPercentage: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: salesgenie
spec:
  selector:
    app.kubernetes.io/name: ai-gateway
  ports:
  - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salesgenie-ingress
  namespace: salesgenie
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.salesgenie.ai/login
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.salesgenie.ai
    secretName: salesgenie-tls
  rules:
  - host: api.salesgenie.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-gateway
            port:
              number: 80
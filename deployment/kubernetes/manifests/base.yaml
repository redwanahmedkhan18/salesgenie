apiVersion: v1
kind: Namespace
metadata:
  name: salesgenie
  labels:
    environment: production
    app.kubernetes.io/name: salesgenie
---
apiVersion: v1
kind: Secret
metadata:
  name: salesgenie-secrets
  namespace: salesgenie
type: Opaque
data:
  DATABASE_URL: <base64-encoded-db-url>
  REDIS_URL: <base64-encoded-redis-url>
  JWT_SECRET: <base64-encoded-jwt-secret>
  STRIPE_SECRET_KEY: <base64-encoded-stripe-key>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: salesgenie-config
  namespace: salesgenie
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  API_VERSION: "v1"
  RATE_LIMIT_GLOBAL: "100000"
  RATE_LIMIT_AUTH: "10"
  CORS_ORIGINS: "https://salesgenie.ai,https://app.salesgenie.ai"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  namespace: salesgenie
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/component: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-gateway
    spec:
      containers:
        - name: ai-gateway
          image: ghcr.io/salesgenie/ai-gateway:v1.0.0
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: salesgenie-config
            - secretRef:
                name: salesgenie-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-gateway-hpa
  namespace: salesgenie
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: batch/v1
kind: Job
metadata:
  name: db-migration
  namespace: salesgenie
  labels:
    app.kubernetes.io/name: db-migration
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-migration
          image: ghcr.io/salesgenie/ai-gateway:v1.0.0
          command: ["sh", "-c", "PYTHONPATH=/app alembic -c enterprise-ai-platform/database/migrations/alembic.ini upgrade head"]
          envFrom:
            - configMapRef:
                name: salesgenie-config
            - secretRef:
                name: salesgenie-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
  namespace: salesgenie
spec:
  selector:
    app.kubernetes.io/name: ai-gateway
  ports:
  - name: http
    port: 80
    targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salesgenie-ingress
  namespace: salesgenie
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/auth-signin: https://auth.salesgenie.ai/login
    nginx.ingress.kubernetes.io/rate-limit: "100"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
  - hosts:
    - api.salesgenie.ai
    secretName: salesgenie-tls
  rules:
  - host: api.salesgenie.ai
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ai-gateway
            port:
              number: 80
[tool.poetry]
name = "salesgenie-tests"
version = "1.0.0"
description = "SalesGenie Testing Suite"
authors = ["SalesGenie Team"]

[tool.poetry.dependencies]
python = "^3.11"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^4.1.0"
httpx = "^0.25.0"
faker = "^24.0.0"
pydantic = "^2.0.0"
asyncpg = "^0.29.0"
SQLAlchemy = "^2.0.0"

[tool.poetry.group.dev.dependencies]
pytest-mock = "^3.14.0"
pytest-benchmark = "^4.0.0"
pytest-html = "^4.1.0"
allure-pytest = "^2.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "security: Security tests",
    "performance: Performance tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["enterprise_ai_platform"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]